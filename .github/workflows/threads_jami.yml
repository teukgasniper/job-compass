name: 쓰레드 자동발행 (jami)

on:
  schedule:
    - cron: "41 * * * *"  # 매시간 41분 — GitHub 예약 실행이 자주 빠져서 촘촘하게 깨우고, 발행 간격은 MIN_GAP_MIN(110분)으로 2시간 유지
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트만 (글 생성해서 보여주기만, 발행 X)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-jami
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 예약 실행은 Variables의 THREADS_AUTO_JAMI 가 'on' 일 때만 동작 (수동 실행은 항상 가능)
    if: github.event_name == 'workflow_dispatch' || vars.THREADS_AUTO_JAMI == 'on'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 pillow cairosvg
      - run: sudo apt-get install -y -qq fonts-nanum   # 로고 실패 시 기관명 텍스트 카드용 한글 폰트

      - name: 후킹글 생성 + 발행
        env:
          ACCOUNT: jami
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN_JAMI }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_JAMI }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          COMMENT_LINK: ${{ vars.COMMENT_LINK_JAMI || 'profile' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          JITTER_MAX_MIN: ${{ github.event_name == 'schedule' && '15' || '0' }}
          MIN_GAP_MIN: ${{ github.event_name == 'schedule' && '110' || '60' }}   # 예약 실행만 110분 (수동은 60분)
        run: python publish_to_threads.py

      - name: 사용 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in threads_state logos logos_text logos_missing.txt; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "기록 변경 없음"; exit 0
          fi
          git commit -m "threads(jami): 발행 기록 업데이트"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
