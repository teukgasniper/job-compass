name: 채용공고 업데이트

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 (UTC 기준)
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 채용공고 수집
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
        run: python fetch_jobs.py
      - name: 변경사항 저장
        run: |
          git config user.name "job-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "채용공고 업데이트 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
