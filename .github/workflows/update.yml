name: 채용공고 업데이트

on:
  schedule:
    - cron: "23 * * * *"    # [2026-10-08] 보험용 — 매시간 깨우되, 직전 수집이 3시간 30분 안이면 바로 건너뜀 (아래 gate)
  repository_dispatch:       # [2026-10-08] 주 담당 — 외부 예약(cron-job.org)이 4시간마다 깨움 (GitHub 예약이 자주 빠져서)
    types: [update-jobs]
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read        # [2026-10-08] gate가 '이미 도는 업데이트가 있는지' 확인용

jobs:
  # [2026-10-08] GitHub 예약 실행만 검사: 카드 데이터가 3시간 30분 안에 만들어졌으면 건너뜀 (외부 예약과 겹쳐서 두 번 도는 것 방지)
  #              외부 예약(cron-job.org)·수동 실행은 항상 진행
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: jobs.json
          sparse-checkout-cone-mode: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          MIN_GAP_HOURS: ${{ vars.UPDATE_MIN_GAP_HOURS || '3.5' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --limit 20 \
              --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length" \
              > busy.txt 2>/dev/null || echo 0 > busy.txt
          fi
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          run, why = True, "외부 예약·수동 실행"
          if os.environ["EVENT"] == "schedule":
              try:
                  busy = int((open("busy.txt").read().strip() or "0"))
              except Exception:
                  busy = 0
              try:
                  t = json.load(open("jobs.json", encoding="utf-8"))["generated_at"]
                  age = (datetime.now(kst) - datetime.strptime(t, "%Y-%m-%d %H:%M").replace(tzinfo=kst)).total_seconds() / 3600
                  run = age >= float(os.environ["MIN_GAP_HOURS"]) and busy == 0
                  why = f"직전 수집 {t} KST ({age:.1f}시간 전)" + (f", 이미 도는 업데이트 {busy}개" if busy else "")
              except Exception as e:
                  run = busy == 0
                  why = f"직전 수집 시각 확인 실패 ({e})" + (f", 이미 도는 업데이트 {busy}개" if busy else "")
          print(("▶ 진행" if run else "⏭ 건너뜀") + f": {why}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={'true' if run else 'false'}\n")
          EOF

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # [2026-10-08] 줄 서기(pages)는 실제 수집 단계에만 — 건너뛰는 예약 실행이 줄에 서서
    #              기다리던 수동 공고 발행을 밀어내지 않게
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 채용공고 수집
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          GOJOBS_API_KEY: ${{ secrets.GOJOBS_API_KEY }}
          CLEANEYE_API_KEY: ${{ secrets.CLEANEYE_API_KEY }}
          WORK24_GONGCHAE_KEY: ${{ secrets.WORK24_GONGCHAE_KEY }}  # 고용24 공채속보 (대기업·중견기업)
        run: python fetch_jobs.py

      - name: 상세 글 자동 발행 (hiring03)
        continue-on-error: true      # 발행이 실패해도 카드 데이터 배포는 계속
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PUBLISH_PER_RUN: ${{ vars.PUBLISH_PER_RUN || '5' }}
          GOJOBS_API_KEY: ${{ secrets.GOJOBS_API_KEY }}            # 나라일터 상세 보충
          WORK24_GONGCHAE_KEY: ${{ secrets.WORK24_GONGCHAE_KEY }}  # 공채속보 상세 보충
        run: python publish_to_blogger.py

      - name: 저장소에 백업
        run: |
          [ -f job_posts.json ] || echo '{}' > job_posts.json
          python save_to_repo.py   # 실행 중 다른 커밋이 들어와도 충돌 없이 저장 (발행 기록 합치기)

      - name: 배포 파일 준비
        run: |
          mkdir -p _site
          cp jobs.json job_posts.json _site/
          [ -f views.json ] && cp views.json _site/ || true   # 추천순 조회수 점수용
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
