name: 채용공고 업데이트

on:
  schedule:
    - cron: "23 */4 * * *"  # 4시간마다 23분 (UTC 기준, 정각은 GitHub 예약 실행이 자주 빠져서 피함)
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 채용공고 수집
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          GOJOBS_API_KEY: ${{ secrets.GOJOBS_API_KEY }}
          CLEANEYE_API_KEY: ${{ secrets.CLEANEYE_API_KEY }}
          WORK24_GONGCHAE_KEY: ${{ secrets.WORK24_GONGCHAE_KEY }}  # 고용24 공채속보 (대기업·중견기업)
        run: python fetch_jobs.py

      - name: 상세 글 자동 발행 (hiring03)
        continue-on-error: true      # 발행이 실패해도 카드 데이터 배포는 계속
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PUBLISH_PER_RUN: ${{ vars.PUBLISH_PER_RUN || '5' }}
          GOJOBS_API_KEY: ${{ secrets.GOJOBS_API_KEY }}            # 나라일터 상세 보충
          WORK24_GONGCHAE_KEY: ${{ secrets.WORK24_GONGCHAE_KEY }}  # 공채속보 상세 보충
        run: python publish_to_blogger.py

      - name: 저장소에 백업
        run: |
          [ -f job_posts.json ] || echo '{}' > job_posts.json
          python save_to_repo.py   # 실행 중 다른 커밋이 들어와도 충돌 없이 저장 (발행 기록 합치기)

      - name: 배포 파일 준비
        run: |
          mkdir -p _site
          cp jobs.json job_posts.json _site/
          [ -f views.json ] && cp views.json _site/ || true   # 추천순 조회수 점수용
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
